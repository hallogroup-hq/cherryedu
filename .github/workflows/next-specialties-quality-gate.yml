name: CherryEdu Next 3 Specializations — Curriculum QA
on:
  pull_request:
    branches: [feat/final-assessments-qa]
    paths:
      - 'lib/data/greenCoffeeV2Course.ts'
      - 'lib/data/coffeeShopV2Course.ts'
      - 'lib/data/qProcessorV2Course.ts'
      - 'lib/data/greenCoffeeScenarios.ts'
      - 'lib/data/nextSpecialtyScenarios.ts'
      - 'lib/server/final-exams/**'
      - 'components/Footer.tsx'
      - 'components/curated/CuratedScenarioLab.tsx'
      - 'components/curated/NextSpecialtyCalculators.tsx'
      - 'app/green-coffee-v2/**'
      - 'app/coffee-shop-v2/**'
      - 'app/q-processor-v2/**'
      - 'app/ujian-akhir/**'
      - 'app/api/final-exams/**'
      - 'lib/finalExamPaths.ts'
      - 'lib/server/finalExamCatalog.ts'
      - 'lib/store.tsx'
      - 'middleware.ts'
      - 'tests/next-specialties/**'
      - 'tests/final-exams/**'
      - 'scripts/validate-next-specialties.cjs'
      - 'playwright.next-specialties.config.ts'
      - 'playwright.final-exams.config.ts'
      - '.github/workflows/next-specialties-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CHERRYEDU_CURRICULUM_PREVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_FOUNDATION_V2_PREVIEW: review-only
      CHERRYEDU_FINAL_EXAMS_REVIEW: enabled
      CHERRYEDU_NEXT_SPECIALTY_REVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_NEXT_SPECIALTY_PREVIEW: enabled
      CHERRYEDU_BARISTA_V2_REVIEW: enabled
      CHERRYEDU_HOME_BREWER_V2_REVIEW: enabled
      CHERRYEDU_ROASTER_V2_REVIEW: enabled
      CHERRYEDU_SENSORY_V2_REVIEW: enabled
      CHERRYEDU_BUSINESS_ROASTERY_REVIEW: enabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: New specialization lesson and exam validator
        run: node scripts/validate-next-specialties.cjs
      - name: Existing six-path final exam regression validator
        run: node scripts/validate-final-exams.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build full nine-path review
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Nine-path final exam and learner continuation regression
        run: npx playwright test --config=playwright.final-exams.config.ts
      - name: Three specialty curriculum learning experience and finance tests
        run: npx playwright test --config=playwright.next-specialties.config.ts
      - name: Established Foundation-based reader regression
        run: npx playwright test --config=playwright.curated.config.ts
