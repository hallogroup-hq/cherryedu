name: Q Processor V3 — Specialist Curriculum Release Gates
on:
  push:
    branches:
      - feat/q-processor-specialist-depth-v3
    paths:
      - 'lib/data/qProcessorV2Course.ts'
      - 'lib/data/nextSpecialtyScenarios.ts'
      - 'lib/server/final-exams/q-processor.json'
      - 'lib/finalExamPaths.ts'
      - 'lib/store.tsx'
      - 'app/q-processor-v2/**'
      - 'app/ujian-akhir/**'
      - 'app/api/final-exams/**'
      - 'tests/next-specialties/**'
      - 'tests/final-exams/**'
      - 'scripts/validate-q-processor-v3.cjs'
      - 'scripts/validate-next-specialties.cjs'
      - 'docs/curriculum/q-processor-v3/**'
      - '.github/workflows/q-processor-v3-quality-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CHERRYEDU_CURRICULUM_PREVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_FOUNDATION_V2_PREVIEW: review-only
      CHERRYEDU_FINAL_EXAMS_REVIEW: enabled
      CHERRYEDU_NEXT_SPECIALTY_REVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_NEXT_SPECIALTY_PREVIEW: enabled
      CHERRYEDU_BARISTA_V2_REVIEW: enabled
      CHERRYEDU_HOME_BREWER_V2_REVIEW: enabled
      CHERRYEDU_ROASTER_V2_REVIEW: enabled
      CHERRYEDU_SENSORY_V2_REVIEW: enabled
      CHERRYEDU_BUSINESS_ROASTERY_REVIEW: enabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Q Processor V3 manuscript, science, safety and numerical audit
        run: node scripts/validate-q-processor-v3.cjs
      - name: Cross-specialty inventory and nine-path exam integrity
        run: |
          node scripts/validate-next-specialties.cjs
          node scripts/validate-green-coffee-v3.cjs
          node scripts/validate-coffee-shop-v3.cjs
          node scripts/validate-final-exams.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build complete curriculum
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Three specialty QA, Q Processor decision labs and mobile screenshots
        run: npx playwright test --config=playwright.next-specialties.config.ts
      - name: Nine-path final exam progression and API grading
        run: npx playwright test --config=playwright.final-exams.config.ts
      - name: Approved curated reader regression
        run: npx playwright test --config=playwright.curated.config.ts
      - name: Disabled specialty access security regression
        run: npx playwright test --config=playwright.specialty-gate.config.ts
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q-processor-v3-visual-evidence
          path: audit-screenshots/
          if-no-files-found: ignore
          retention-days: 14
