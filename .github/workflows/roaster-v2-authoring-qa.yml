name: Roaster V2 authoring and compatibility gates
on:
  pull_request:
    paths:
      - 'docs/curriculum/roaster-v2/**'
      - 'lib/data/roaster-v2/**'
      - 'lib/data/roasterV2Course.ts'
      - 'lib/data/roasterV2Practice.ts'
      - 'app/roaster-v2/**'
      - 'components/roaster-v2/**'
      - 'scripts/validate-roaster-v2.cjs'
      - 'tests/roaster/**'
      - 'playwright.roaster.config.ts'
      - '.github/workflows/roaster-v2-authoring-qa.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/validate-roaster-v2.cjs
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CHERRYEDU_ROASTER_V2_REVIEW: enabled
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.roaster.config.ts
        env:
          NEXT_TELEMETRY_DISABLED: '1'
