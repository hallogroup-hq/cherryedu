name: Foundation V2 Release Gates

on:
  push:
    branches:
      - release/foundation-v2-rc
  pull_request:
    paths:
      - 'docs/curriculum/foundation-v2/**'
      - 'scripts/validate-foundation-v2.cjs'
      - 'package.json'
      - '.github/workflows/foundation-v2-release-gates.yml'
      - 'lib/**'
      - 'app/**'
      - 'components/**'

permissions:
  contents: read

concurrency:
  group: foundation-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authoring-integrity:
    name: Content / Question / Link Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-foundation-v2.cjs

  application-preview-build:
    name: Typecheck and Build (No Deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
