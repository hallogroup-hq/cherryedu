name: Coffee Shop V3 — Specialist Curriculum Release Gates
on:
  push:
    branches:
      - feat/coffee-shop-specialist-depth-v3
    paths:
      - 'lib/data/coffeeShopV2Course.ts'
      - 'lib/data/nextSpecialtyScenarios.ts'
      - 'components/curated/CoffeeShopPlanningLabs.tsx'
      - 'lib/finalExamPaths.ts'
      - 'lib/server/final-exams/coffee-shop.json'
      - 'app/ujian-akhir/**'
      - 'app/api/final-exams/**'
      - 'app/coffee-shop-v2/**'
      - 'lib/store.tsx'
      - 'tests/next-specialties/**'
      - 'tests/final-exams/**'
      - 'scripts/validate-coffee-shop-v3.cjs'
      - 'scripts/validate-next-specialties.cjs'
      - 'playwright.next-specialties.config.ts'
      - '.github/workflows/coffee-shop-v3-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CHERRYEDU_CURRICULUM_PREVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_FOUNDATION_V2_PREVIEW: review-only
      CHERRYEDU_FINAL_EXAMS_REVIEW: enabled
      CHERRYEDU_NEXT_SPECIALTY_REVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_NEXT_SPECIALTY_PREVIEW: enabled
      CHERRYEDU_BARISTA_V2_REVIEW: enabled
      CHERRYEDU_HOME_BREWER_V2_REVIEW: enabled
      CHERRYEDU_ROASTER_V2_REVIEW: enabled
      CHERRYEDU_SENSORY_V2_REVIEW: enabled
      CHERRYEDU_BUSINESS_ROASTERY_REVIEW: enabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Coffee Shop V3 content and numerical audit
        run: node scripts/validate-coffee-shop-v3.cjs
      - name: Nine-path curriculum/exam integrity
        run: |
          node scripts/validate-next-specialties.cjs
          node scripts/validate-final-exams.cjs
      - name: Types
        run: npm run typecheck
      - name: Build complete curriculum
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Three-specialty QA, cash lab, menu lab and mobile screenshots
        run: npx playwright test --config=playwright.next-specialties.config.ts
      - name: Nine-path exam journey
        run: npx playwright test --config=playwright.final-exams.config.ts
      - name: Existing curated reader regression
        run: npx playwright test --config=playwright.curated.config.ts
      - name: Closed specialty access security regression
        run: npx playwright test --config=playwright.specialty-gate.config.ts
      - name: Preserve genuine browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coffee-shop-v3-visual-evidence
          path: audit-screenshots/
          if-no-files-found: ignore
          retention-days: 14
