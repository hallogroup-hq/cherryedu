name: Business Roastery authoring and finance-integrity gates
on:
  pull_request:
    paths:
      - 'app/business-roastery-v1/**'
      - 'components/business-roastery/**'
      - 'lib/data/businessRoasteryCourse.ts'
      - 'lib/data/businessRoasteryReferences.ts'
      - 'docs/curriculum/business-roastery-v1/**'
      - 'scripts/validate-business-roastery.cjs'
      - 'scripts/validate-business-roastery-numbers.cjs'
      - 'tests/business-roastery/**'
      - 'playwright.business-roastery.config.ts'
      - '.github/workflows/business-roastery-authoring-qa.yml'
  workflow_dispatch:
jobs:
  business-authoring-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/validate-business-roastery.cjs
      - run: node scripts/validate-business-roastery-numbers.cjs
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CHERRYEDU_BUSINESS_ROASTERY_REVIEW: enabled
          CHERRYEDU_SENSORY_V2_REVIEW: enabled
          CHERRYEDU_ROASTER_V2_REVIEW: enabled
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.business-roastery.config.ts
        env:
          NEXT_TELEMETRY_DISABLED: '1'
