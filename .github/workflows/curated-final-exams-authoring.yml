name: CherryEdu Final Exams Authoring (No Deploy)
on:
  push:
    branches:
      - feat/cherryedu-curated-final-exams
  pull_request:
    branches:
      - preview/cherryedu-curated-2026-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NEXT_PUBLIC_CHERRYEDU_CURRICULUM_PREVIEW: enabled
      NEXT_PUBLIC_CHERRYEDU_FOUNDATION_V2_PREVIEW: review-only
      CHERRYEDU_BARISTA_V2_REVIEW: enabled
      CHERRYEDU_HOME_BREWER_V2_REVIEW: enabled
      CHERRYEDU_ROASTER_V2_REVIEW: enabled
      CHERRYEDU_SENSORY_V2_REVIEW: enabled
      CHERRYEDU_BUSINESS_ROASTERY_REVIEW: enabled
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Foundation final exam item and numeric review
        run: node scripts/validate-foundation-final-exam.cjs
      - name: Source boundary and typecheck
        run: npm run typecheck
